<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Harness — code to film</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae1;color:#162421;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;object-fit:contain}nav{position:fixed;bottom:8px;left:16px;display:flex;gap:8px;background:#eeeae1;padding:8px}body.exporting nav{display:none}button,input{accent-color:#145848}button{padding:6px 12px}
</style>
<canvas width="960" height="540" role="img" aria-label="Small core. Real output. A deterministic six-second animation of geometry, sound waves and film frames."></canvas>
<nav aria-label="Preview controls"><button id="play">Play</button><input id="seek" aria-label="Seek time" type="range" min="0" max="6" step="0.01" value="5"><output id="time">5.00s</output></nav>
<script>
// Six seconds, 16:9. One absolute clock owns every property. No libraries,
// timers in the export path, external assets or frame-history dependence.
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-clamp(x))**3;
const ink='#162421',green='#145848',orange='#c85532',paper='#eeeae1';
const preview=new URLSearchParams(location.search).has('preview');
const seek=document.querySelector('#seek'),clock=document.querySelector('#time');
let animation=0;
function line(x,y,X,Y,color=ink,width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();}
function text(s,x,y,size=14,color=ink,weight=500){c.fillStyle=color;c.font=`${weight} ${size}px system-ui,sans-serif`;c.fillText(s,x,y);}
function geometry(t){
  const points=Array.from({length:8},(_,i)=>{const a=i*Math.PI/4+t*.45;return[700+125*Math.cos(a),258+85*Math.sin(a)*Math.cos(t*.35)+35*Math.cos(a)*Math.sin(t*.35)];});
  for(let i=0;i<8;i++)for(let j=i+1;j<8;j++)if((j-i)%3===0||j===i+1)line(...points[i],...points[j],'#82a99b',1.5);
  points.forEach(([x,y],i)=>{c.fillStyle=i%3===0?orange:green;c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fill();});
  text('01 / GEOMETRY',556,142,13,green,650);text('Absolute time. Reproducible frames.',556,378,12);
}
function sound(t){
  text('02 / SOUND',556,142,13,green,650);line(554,260,850,260,'#c8ccc2');
  for(let i=0;i<61;i++){const x=556+i*4.8,envelope=Math.sin(Math.PI*i/60)**1.5,h=8+envelope*(20+60*Math.abs(Math.sin(i*.19-t*2.4)));line(x,260-h,x,260+h,i%7===0?orange:green,2);}
  text('Oscillators + noise + envelopes.',556,378,12);
}
function film(t){
  text('03 / FILM',556,142,13,green,650);
  for(let i=0;i<3;i++){const y=190+i*24,x=577+i*33,p=ease((t-4-i*.12)/.7);c.save();c.globalAlpha*=p;c.fillStyle=paper;c.fillRect(x,y,194,116);c.strokeStyle=i===2?green:'#a0ada4';c.lineWidth=2;c.strokeRect(x,y,194,116);line(x+14,y+18,x+70,y+18,orange,3);text('FRAME '+String(120+i).padStart(3,'0'),x+14,y+96,12);c.restore();}
  text('PNG frames → H.264 + AAC.',556,378,12);
}
window.renderReady=document.fonts.ready;
window.renderFrame=function(seconds){
  const t=Math.max(0,Math.min(6,seconds));document.body.classList.toggle('exporting',!preview);
  c.globalAlpha=1;c.fillStyle=paper;c.fillRect(0,0,960,540);
  text('POCKET HARNESS',54,57,14,green,700);text('NATIVE CORE / OPEN TOOLKIT',54,487,11,green,650);
  text('Small core.',50,207,57,ink,650);text('Real output.',50,272,57,ink,650);
  text('Code → frames → film.',54,322,20);text('No browser SDK. No animation framework.',54,351,13,'#53635b');
  line(510,110,510,405,'#c2c9bd');
  const cross=(start)=>clamp((t-start)/.25);
  for(const [fn,a] of [[geometry,1-cross(1.9)],[sound,cross(1.9)*(1-cross(3.9))],[film,cross(3.9)]]){c.save();c.globalAlpha=a;if(a>0)fn(t);c.restore();}
  line(54,425,906,425,'#c2c9bd',2);line(54,425,54+852*t/6,425,green,3);
  [0,2,4,6].forEach(v=>text(String(v)+'s',54+852*v/6-6,449,10,'#53635b'));
  text('06 SEC / 144 FRAMES',731,487,11,green,650);
  seek.value=t;clock.value=t.toFixed(2)+'s';
};
seek.oninput=()=>{cancelAnimationFrame(animation);window.renderFrame(Number(seek.value));};
document.querySelector('#play').onclick=()=>{cancelAnimationFrame(animation);const start=performance.now();const tick=now=>{const t=(now-start)/1000;window.renderFrame(t);if(t<6)animation=requestAnimationFrame(tick);};animation=requestAnimationFrame(tick);};
// A static complete message by default, including reduced-motion users.
window.renderFrame(5.5);
</script></html>
