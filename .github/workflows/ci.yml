name: C++ checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make -j2 test CXX=${{ matrix.compiler }}
      - run: make check-workflows
      - run: make bench CXX=${{ matrix.compiler }}
      - name: Package and installation smoke
        run: ./scripts/test-release.sh
      - name: Real browser and media export
        if: matrix.compiler == 'g++'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v google-chrome || command -v chromium
          python3 tests/media_integration.py ./pocket --out build/media-integration
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make -j2 sanitize
